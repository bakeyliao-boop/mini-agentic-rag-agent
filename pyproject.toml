[project]
name = "mini-agentic-rag-agent"
version = "0.1.0"
description = "A minimal, evidence-grounded Agentic RAG reference implementation."
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb==1.5.9",
    "fastapi==0.116.0",
    "langchain==1.3.11",
    "langchain-chroma==1.1.0",
    "langchain-openai==1.3.3",
    "langgraph==1.2.7",
    "pydantic==2.12.4",
    "python-dotenv==1.2.2",
    "uvicorn==0.38.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.0.1",
]

[tool.uv]
package = false
